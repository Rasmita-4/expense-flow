<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExpenseFlow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <!-- Header/Title -->
    <header class="app-header">
      <h1><span class="accent">ExpenseFlow</span></h1>
      <p class="subtitle">Track your money. Understand your spending.</p>
    </header>

    <!-- Summary Cards -->
    <section class="summary-section">
      <div class="cards-grid">
        <div class="card card-income">
          <div class="card-icon">💰</div>
          <div class="card-content">
            <div class="card-title">Income</div>
            <div class="card-amount" id="income-total">$0.00</div>
          </div>
        </div>
        <div class="card card-expense">
          <div class="card-icon">💳</div>
          <div class="card-content">
            <div class="card-title">Expenses</div>
            <div class="card-amount" id="expense-total">$0.00</div>
          </div>
        </div>
        <div class="card card-balance">
          <div class="card-icon">📊</div>
          <div class="card-content">
            <div class="card-title">Balance</div>
            <div class="card-amount" id="balance">$0.00</div>
          </div>
        </div>
        <div class="card card-count">
          <div class="card-icon">📋</div>
          <div class="card-content">
            <div class="card-title">Transactions</div>
            <div class="card-amount" id="transaction-count">0</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Add Transaction Form -->
    <section class="form-section">
      <h2 class="section-title">Add Transaction</h2>
      <form class="transaction-form" id="transaction-form">
        <div class="form-row">
          <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" placeholder="e.g. Salary, Groceries" required>
          </div>
          <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" step="0.01" placeholder="0.00" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="type">Type</label>
            <select id="type" required>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </div>
          <div class="form-group">
            <label for="category">Category</label>
            <input type="text" id="category" placeholder="e.g. Food, Work, Transport" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required>
          </div>
          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" rows="2" placeholder="Optional description..."></textarea>
          </div>
        </div>
        <button type="submit" class="btn-add">Add Transaction</button>
      </form>
    </section>

    <!-- Filter Controls -->
    <section class="filter-section">
      <div class="filter-container">
        <input type="text" id="search-input" placeholder="Search by title or category..." class="search-input" />
        <select id="type-filter" class="type-filter">
          <option value="">All</option>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
        <select id="category-filter" class="category-filter">
          <option value="">All Categories</option>
        </select>
        <div class="month-year-filter">
  <select id="month-filter" class="month-filter">
    <option value="">All months</option>
    <option value="January">January</option>
    <option value="February">February</option>
    <option value="March">March</option>
    <option value="April">April</option>
    <option value="May">May</option>
    <option value="June">June</option>
    <option value="July">July</option>
    <option value="August">August</option>
    <option value="September">September</option>
    <option value="October">October</option>
    <option value="November">November</option>
    <option value="December">December</option>
  </select>
  <select id="year-filter" class="year-filter">
    <option value="">All years</option>
    <option value="2024">2024</option>
    <option value="2025">2025</option>
    <option value="2026">2026</option>
    <option value="2027">2027</option>
    <option value="2028">2028</option>
  </select>
</div>
      </div>
    </section>

    <!-- Recent Transactions -->
<section class="recent-transactions-section">
  <h3 class="section-title">Recent Transactions</h3>
  <div class="recent-list" id="recent-list"></div>
  <button class="view-all-btn" id="view-all-btn">View all</button>
</section>

<!-- Transactions List -->
    <!-- Expense Chart -->
<section class="expense-chart-section">
  <h3 class="chart-title">Expenses by Category</h3>
  <div class="chart-container">
    <div class="chart-empty" id="chart-empty">No expense data yet.</div>
    <div class="chart-bars" id="chart-bars"></div>
  </div>
</section><section class="transactions-section">
      <h2 class="section-title">Transactions</h2>
      <p class="empty-state" id="empty-state">No transactions yet. Add one above!</p>
      <ul class="transactions-list" id="transactions-list"></ul>
    </section>
  </main>
<script src="app.js" defer></script>
</body>
</html>
